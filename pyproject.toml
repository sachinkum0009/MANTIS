[project]
name = "mantis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "draccus>=0.10.0",
    "ikpy>=3.4.2",
    "lerobot[all]==0.5.1",
    "pathlib>=1.0.1",
    "pyzmq>=27.1.0",
    "transformers>=5.3.0",
    "websockets>=16.0",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "pre-commit>=4.5.1",
    "pytest>=8.4.2",
]

[project.scripts]
server = "mantis.scripts.web_stream:main"
